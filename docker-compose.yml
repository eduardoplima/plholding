services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: plholding
      POSTGRES_PASSWORD: plholding
      POSTGRES_DB: plholding
    # host 55432 to avoid clashing with other local postgres/forwards on 5432/5433
    ports: ["55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://plholding:plholding@db:5432/plholding
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: plholding-dev
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: dev-secret-change-me
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: [db, storage]
volumes:
  pgdata:
  miniodata:
